command:
  - sh
  - -c
  - >
    set -e;
    cd /app/python/source_code;
    echo '[NUCLEA] Building UI...';
    if [ -f node_modules/.bin/vite ]; then
      ./node_modules/.bin/vite build || echo '[NUCLEA] UI build failed; serving fallback';
    else
      echo '[NUCLEA] vite not installed; skipping UI build';
    fi;
    ls -la src/nuclea_modeler/__dist__/ 2>/dev/null || true;
    echo '[NUCLEA] Running migrations (pre-uvicorn, single shot)...';
    PYTHONPATH=src python -m scripts.run_migrations || { echo '[NUCLEA] Migrations failed; abortando.'; exit 1; };
    PORT=${DATABRICKS_APP_PORT:-8000};
    echo "[NUCLEA] ENV: PORT=$PORT CATALOG=${NUCLEA_CATALOG:-?} SCHEMA=${NUCLEA_SCHEMA:-?} WAREHOUSE=${NUCLEA_WAREHOUSE_ID:-?}";
    ( sleep 12; echo "[NUCLEA] self-probe -> http://localhost:$PORT/"; python -c "import urllib.request; r=urllib.request.urlopen('http://localhost:$PORT/',timeout=5); print('[NUCLEA] self-probe OK: HTTP',r.status,'len',len(r.read()))" 2>&1 || echo "[NUCLEA] self-probe FALHOU: uvicorn nao respondeu localmente em $PORT" ) &
    echo "[NUCLEA] Starting uvicorn on port $PORT (log-level ${UVICORN_LOG_LEVEL:-info})...";
    exec uvicorn nuclea_modeler.backend.app:app --host 0.0.0.0 --port $PORT --workers 2 --app-dir src --proxy-headers --forwarded-allow-ips '*' --log-level ${UVICORN_LOG_LEVEL:-info}

# App resources — concede ao service principal do app o scope SQL no token OAuth.
# Sem essa declaração o app SP cai em PAT-auth e não tem permissão sql.
# Secrets são adicionados sob demanda quando uma conexão real for cadastrada
# (Databricks Apps exige uma key específica por secret resource — '*' não aceito).
resources:
  - name: nuclea-warehouse
    description: SQL Warehouse usado para ler/escrever as tabelas Delta do app
    sql_warehouse:
      id: b8e52268d9828bdd
      permission: CAN_USE
  - name: nuclea-lakebase
    description: Lakebase Postgres sandbox para validação dos diagramas vs DB real
    database:
      database_name: databricks_postgres
      instance_name: JDBCTESTLAKEBASE
      permission: CAN_CONNECT_AND_CREATE

env:
  - name: PYTHONPATH
    value: /app/python/source_code/src
  - name: NODE_OPTIONS
    value: --max-old-space-size=2048
  - name: NUCLEA_CATALOG
    value: stable_classic_pg4xe1_catalog
  - name: NUCLEA_SCHEMA
    value: data_catalog_app
  - name: NUCLEA_WAREHOUSE_ID
    value: b8e52268d9828bdd
  - name: NUCLEA_SECRETS_SCOPE
    value: nuclea-modeler
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    value: b8e52268d9828bdd
  # Migrations rodam 1x no command: antes do uvicorn (evita contention entre
  # os 2 workers). Desabilitamos o lifespan auto-apply pra não duplicar.
  - name: NUCLEA_MIGRATIONS_AUTO_APPLY
    value: "false"
