[project]
name = "nuclea-modeler"
dynamic = ["version"]
description = "Núclea data catalog & modeling app — Databricks-native"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "databricks-sql-connector>=3.5.0",
    "sqlglot>=25.0.0",
    "pyodbc>=5.1.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.apx.metadata]
app-name = "nuclea-modeler"
app-slug = "nuclea_modeler"
app-entrypoint = "nuclea_modeler.backend.app:app"
api-prefix = "/api"
metadata-path = "src/nuclea_modeler/_metadata.py"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/nuclea_modeler/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/nuclea_modeler/__dist__", "src/nuclea_modeler/_metadata.py"]