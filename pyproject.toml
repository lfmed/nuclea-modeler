[project]
name = "nuclea-modeler"
version = "0.2.1"
description = "Núclea data catalog & modeling app — Databricks-native"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "databricks-sql-connector>=3.5.0",
    "sqlglot>=25.0.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.3.4",  # Lakebase Postgres connectivity
    "pyodbc>=5.3.0",            # ODBC connection tests (M1)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "bandit>=1.7.10",
    "starlette>=0.40.0",  # used by tests via TestClient (also a FastAPI dep)
    "httpx>=0.28.0",      # used by tests + REST tester
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuclea_modeler = ["__dist__/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default rules + a small pragmatic baseline. We don't enable the full suite
# because the codebase predates the linter — adopt incrementally.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length — handled by formatter
    "E741",  # ambiguous variable name (we use `l`, `O` deliberately in places)
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely use `pytest.importorskip(...)` BEFORE other imports — the
# pattern is intentional (skip whole module if optional dep missing) and would
# otherwise trip E402. Also F401 for fixtures-as-imports.
"tests/**" = ["E402", "F401"]
# Auto-generated migration scripts are not Python source.
"src/nuclea_modeler/__dist__/**" = ["F401", "F811", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Coverage thresholds:
# - 75% minimum global — fails the build below this.
# - Threshold subiu de 60→75 quando a baseline real (atual ~81%) ficou estável.
#   The catalog/router layer é hard de cobrir sem SQL Warehouse live;
#   meaningful coverage vive nos pure-logic modules (ddl/generators,
#   core/delta, core/security, core/logging, core/features, core/metrics,
#   connections/testers, audit/service, migrations).
addopts = "-q --tb=short --cov=nuclea_modeler --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
source = ["src/nuclea_modeler"]
omit = [
    # Auto-generated / metadata-only
    "src/nuclea_modeler/_version.py",
    "src/nuclea_modeler/_metadata.py",
    "src/nuclea_modeler/__dist__/*",
    # Hard to unit-test without a Warehouse — covered by smoke tests instead
    "src/nuclea_modeler/backend/core/_factory.py",
    "src/nuclea_modeler/backend/core/_static.py",
    "src/nuclea_modeler/backend/core/_defaults.py",
    "src/nuclea_modeler/backend/core/_base.py",
    # Router layers são thin glue (FastAPI handlers + Pydantic). Lógica está
    # nos service.py; routers são exercitados implicitamente no smoke E2E.
    # Cobertura unitária deles exige TestClient com SQL Warehouse mock complexo.
    "src/nuclea_modeler/backend/*/router.py",
    # Lakebase service depende de psycopg + Databricks SDK live; coberto por
    # smoke quando a sandbox real está configurada.
    "src/nuclea_modeler/backend/lakebase/service.py",
    # Connections service idem (REST/ODBC live tests no testers.py)
    "src/nuclea_modeler/backend/connections/service.py",
    # Sync e versions services têm porções grandes dependentes de Warehouse —
    # funções puras críticas (compute_diff, next_version_number, _classify_status)
    # estão testadas; o resto é orquestração que precisa de SQL live.
    # Dashboard/admin/uc routers são thin glue (aggregations SQL ou SDK passthrough)
    # — cobertura via smoke E2E quando o app está live.
    "src/nuclea_modeler/backend/dashboard/router.py",
    "src/nuclea_modeler/backend/admin/router.py",
    "src/nuclea_modeler/backend/uc/router.py",
    "src/nuclea_modeler/backend/sessions/router.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    'if __name__ == "__main__":',
]
show_missing = true
skip_covered = false

[tool.bandit]
# Bandit static security analyser — hard-gate no CI.
# Skips são deliberados — não silenciamos achados reais, só ruído conhecido.
exclude_dirs = [
    "tests",           # asserts em test são esperados (B101)
    "src/nuclea_modeler/__dist__",
    ".venv",
]
skips = [
    "B101",  # assert_used — em test code só, mas exclude_dirs já cobre
    "B404",  # subprocess import (usamos em scripts/ legítimo)
    "B603",  # subprocess sem shell=True (forma SEGURA, não warn)
    # B608 = hardcoded SQL expressions. ~30 sites Low-confidence, todos
    # auditados manualmente — todos são:
    # (a) f-string com identifier validado por _require_ident() (sync/diagram)
    # (b) f-string com IDs vindos de query prévia ao banco (_quote_id helper)
    # (c) interpolação só de table names via s.fq_table()
    # Input do usuário 100% usa delta.param() — auditado e documentado em ADR-0003.
    "B608",
]

# APX metadata retained for reference. Not used by the Databricks Apps runtime.
[tool.apx.metadata]
app-name = "nuclea-modeler"
app-slug = "nuclea_modeler"
app-entrypoint = "nuclea_modeler.backend.app:app"
api-prefix = "/api"
