[project]
name = "nuclea-modeler"
version = "0.1.0"
description = "Núclea data catalog & modeling app — Databricks-native"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "databricks-sql-connector>=3.5.0",
    "sqlglot>=25.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nuclea_modeler = ["__dist__/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# APX metadata retained for reference. Not used by the Databricks Apps runtime.
[tool.apx.metadata]
app-name = "nuclea-modeler"
app-slug = "nuclea_modeler"
app-entrypoint = "nuclea_modeler.backend.app:app"
api-prefix = "/api"
