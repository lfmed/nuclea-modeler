name: E2E

# Opt-in: roda apenas quando solicitado manualmente ou em PRs com label "e2e".
# Não rodamos em todo push porque depende de browser binary + build completo
# (~3min vs 30s do CI principal).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  playwright:
    name: Playwright smoke
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install deps
        run: bun install

      - name: Install Playwright + browser
        run: |
          bun add -D @playwright/test
          bunx playwright install --with-deps chromium

      - name: Build production bundle
        run: bun run build

      - name: Run Playwright smoke
        run: bunx playwright test --config tests/e2e/playwright.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
