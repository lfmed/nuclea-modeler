name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
          # psycopg used by extractions/lakebase service is optional at module load
          # but required for full test coverage. Install the binary wheel.
          uv pip install "psycopg[binary]>=3.1"

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/
        continue-on-error: true  # warn-only; turn off once code is formatted

      # Bandit: static security analyser. Warn-only inicialmente para não
      # bloquear PRs antes do triage inicial. Vira hard-gate quando tivermos
      # a baseline de skips estabilizada.
      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r src/ scripts/ -ll
        continue-on-error: true

      - name: Run tests with coverage
        # pytest config (pyproject.toml) já passa --cov --cov-fail-under=60
        run: uv run pytest tests/

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      # Verifies docs/openapi.json matches the live code. If a PR changes a
      # route signature without updating the snapshot, this surfaces it.
      # Warn-only inicialmente — primeiro run gera o snapshot real, operator
      # commita, depois remove continue-on-error.
      - name: OpenAPI snapshot drift check
        run: uv run python -m scripts.dump_openapi --check
        continue-on-error: true

  frontend:
    name: Frontend (build + bundle size)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install deps
        run: bun install

      # `vite build` runs the TanStack Router plugin which generates
      # `types/routeTree.gen.ts`. Run it BEFORE tsc, otherwise tsc fails on
      # the missing generated file. Build is also a stricter check than tsc
      # because Vite resolves all imports + processes Tailwind/PostCSS.
      - name: Production build
        run: bun run build

      - name: TypeScript type check
        run: bun run tsc

      - name: Bundle size budget (warn if > 2 MB total JS)
        run: |
          set -e
          DIST="src/nuclea_modeler/__dist__"
          if [ ! -d "$DIST/assets" ]; then
            echo "::warning::No build output found at $DIST/assets"
            exit 0
          fi
          TOTAL=$(find "$DIST/assets" -name "*.js" -type f -exec wc -c {} + | tail -1 | awk '{print $1}')
          BUDGET=$((2 * 1024 * 1024))
          echo "JS bundle total: ${TOTAL} bytes (budget: ${BUDGET})"
          if [ "$TOTAL" -gt "$BUDGET" ]; then
            echo "::warning::JS bundle ${TOTAL}B exceeds 2MB budget"
          fi
          # Per-chunk listing helps spot regressions
          echo "Per-chunk JS sizes:"
          find "$DIST/assets" -name "*.js" -type f -printf "%f %s\n" | sort -k2 -nr | head -20

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On PRs we diff against the PR base. On pushes to main we scan the
    # whole tree (TruffleHog errors when base == head, e.g. the initial push).
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog (PR — diff against base)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog (push — full scan)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          extra_args: --only-verified
