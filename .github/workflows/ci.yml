name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force Node.js 24 runtime on actions still pinned to Node 20.
# GitHub deprecates Node 20 in June 2026; this opt-in flag preempts the
# deprecation warnings on actions/checkout, setup-uv, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python:
    # Matrix garante compatibilidade entre Python 3.11 (runtime de produção
    # nos Databricks Apps) e 3.12 (devs locais com versões mais novas).
    # 3.13 ainda recente — adicionar quando a maioria das deps testarem nele.
    # fail-fast: false → se 3.11 quebrar, 3.12 ainda roda (e vice-versa).
    name: Python ${{ matrix.python }} (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    # UV_PYTHON garante que TODO `uv run` / `uv pip` use a versão da matrix,
    # não o default do sistema. Sem isso, `uv venv` cria a .venv certa mas
    # `uv run` cai no Python default.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"
          # psycopg used by extractions/lakebase service is optional at module load
          # but required for full test coverage. Install the binary wheel.
          uv pip install "psycopg[binary]>=3.1"

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Deps sync check (pyproject vs requirements)
        run: uv run python -m scripts.check_deps_sync

      # Format check (ruff). Warn-only enquanto base não está 100% formatada.
      # Para promover: rodar `uv run ruff format src/ tests/` num ambiente com
      # rede aberta para PyPI, commitar o resultado, e remover o continue-on-error.
      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/
        continue-on-error: true

      # Bandit: static security analyser. HARD-GATE.
      # Skips (B101/B404/B603/B608) documentados em pyproject.toml — todos
      # auditados manualmente conforme ADR-0003.
      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r src/ scripts/ -ll

      - name: Run tests with coverage
        # pytest config (pyproject.toml) já passa --cov --cov-fail-under=60
        run: uv run pytest tests/

      - name: Upload coverage XML
        # Artifact único por job da matrix (precisa nome distinto para
        # actions/upload-artifact@v7 não rejeitar colisão).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python }}
          path: coverage.xml
          retention-days: 14

      # Verifies docs/openapi.json matches the live code. HARD-GATE — exceto
      # quando snapshot é stub (script detecta via _note keys e emite warning,
      # exit 0). Para gerar o real: `python -m scripts.dump_openapi` num
      # workspace com databricks-sdk e committar.
      - name: OpenAPI snapshot drift check
        run: uv run python -m scripts.dump_openapi --check

  frontend:
    name: Frontend (build + bundle size)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install deps
        run: bun install

      # `vite build` runs the TanStack Router plugin which generates
      # `types/routeTree.gen.ts`. Run it BEFORE tsc, otherwise tsc fails on
      # the missing generated file. Build is also a stricter check than tsc
      # because Vite resolves all imports + processes Tailwind/PostCSS.
      - name: Production build
        run: bun run build

      - name: TypeScript type check
        run: bun run tsc

      - name: Bundle size budget (warn if > 2 MB total JS)
        run: |
          set -e
          DIST="src/nuclea_modeler/__dist__"
          if [ ! -d "$DIST/assets" ]; then
            echo "::warning::No build output found at $DIST/assets"
            exit 0
          fi
          TOTAL=$(find "$DIST/assets" -name "*.js" -type f -exec wc -c {} + | tail -1 | awk '{print $1}')
          BUDGET=$((2 * 1024 * 1024))
          echo "JS bundle total: ${TOTAL} bytes (budget: ${BUDGET})"
          if [ "$TOTAL" -gt "$BUDGET" ]; then
            echo "::warning::JS bundle ${TOTAL}B exceeds 2MB budget"
          fi
          # Per-chunk listing helps spot regressions
          echo "Per-chunk JS sizes:"
          find "$DIST/assets" -name "*.js" -type f -printf "%f %s\n" | sort -k2 -nr | head -20

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On PRs we diff against the PR base. On pushes to main we scan the
    # whole tree (TruffleHog errors when base == head, e.g. the initial push).
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog (PR — diff against base)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog (push — full scan)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          extra_args: --only-verified
